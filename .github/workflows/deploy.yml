name: Deploy slides to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check lockfile has no private registry URLs
        run: |
          if grep -nE 'pkgs\.visualstudio\.com|packagefeedproxy|"resolved"' package-lock.json; then
            echo "::error file=package-lock.json::package-lock.json contains registry URLs. Run 'npm install' locally with the repo .npmrc in place and commit the regenerated lockfile."
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium for PDF export
        run: npx playwright install --with-deps chromium

      # `download: true` in slides.md makes `slidev build` also export dist/<exportFilename>.pdf
      - name: Build site and PDF
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
